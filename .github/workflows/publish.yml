name: Publish AMP Archive

# Manual only for now. Re-enable the schedule once the Graph secrets are set,
# or every nightly run fails and emails you.
on:
  workflow_dispatch:           # "Run workflow" button, any time
  # schedule:
  #   - cron: "0 9 * * *"      # nightly ~09:00 UTC (~4am Chicago)

permissions:
  contents: write      # commit the rebuilt site
  id-token: write      # GitHub OIDC token (no client secret needed)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Without the Graph secrets, skip cleanly rather than fail.
      - name: Check Graph secrets
        id: cfg
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::notice::Graph secrets not configured yet - skipping build (this is not a failure)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - run: pip install msal requests
        if: steps.cfg.outputs.ready == 'true'

      - name: Build the site from SharePoint (Microsoft Graph)
        if: steps.cfg.outputs.ready == 'true'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SHAREPOINT_SITE_URL: ${{ secrets.SHAREPOINT_SITE_URL }}
          ARCHIVE_FOLDER: ${{ secrets.ARCHIVE_FOLDER }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: python scripts/build_site.py --source graph --title "AMP Archive" --password "$PAGE_PASSWORD"

      - name: Publish
        if: steps.cfg.outputs.ready == 'true'
        run: |
          git config user.name "amp-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts/ticker_company.json
          git diff --staged --quiet || git commit -m "Update archive $(date +%F)"
          git push
